<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanya ASABRI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #1c315a;
            color: #222;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 6%;
        }
        .topbar img { width: 130px; background: #fff; padding: 4px 8px; border-radius: 6px; }
        .topbar a { color: #fff; text-decoration: none; font-size: 14px; }
        .chat {
            width: min(760px, 92%);
            margin: 10px auto 30px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 110px);
            min-height: 480px;
        }
        .chat h2 {
            margin: 0;
            padding: 14px 18px;
            color: #c59b2f;
            background: #14244a;
            border-radius: 10px 10px 0 0;
            font-size: 18px;
        }
        #log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f4f5f8;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-line;
        }
        .bot { background: #fff; border: 1px solid #dde1ea; }
        .user { background: #1c315a; color: #fff; margin-left: auto; }
        .src { display: block; margin-top: 6px; font-size: 12px; color: #777; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chips button {
            border: 1px solid #c59b2f;
            background: #fff;
            color: #1c315a;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .chips button:hover { background: #c59b2f; color: #fff; }
        form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e6ee; }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        form button {
            background: #c59b2f;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 15px;
            cursor: pointer;
        }
        form button:disabled { opacity: .6; cursor: default; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="asabri.html"><img src="Picture1.png" alt="Logo ASABRI"></a>
        <a href="asabri.html">&larr; Kembali ke beranda</a>
    </div>

    <div class="chat">
        <h2>Tanya ASABRI</h2>
        <div id="log"></div>
        <form id="ask">
            <input type="text" id="q" maxlength="300" autocomplete="off" placeholder="Tulis pertanyaan, misalnya: berapa iuran pensiun?" required>
            <button type="submit" id="send">Kirim</button>
        </form>
    </div>

    <script>
    const log = document.getElementById('log');
    const form = document.getElementById('ask');
    const input = document.getElementById('q');
    const sendBtn = document.getElementById('send');

    // Semua teks dimasukkan lewat textContent supaya tidak bisa disisipi HTML.
    function addMsg(text, who, source, chips) {
        const div = document.createElement('div');
        div.className = 'msg ' + who;
        div.textContent = text;
        if (source) {
            const s = document.createElement('span');
            s.className = 'src';
            s.textContent = 'Sumber: ' + source;
            div.appendChild(s);
        }
        if (chips && chips.length) {
            const box = document.createElement('div');
            box.className = 'chips';
            chips.forEach(function (c) {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = c;
                b.addEventListener('click', function () { ask(c); });
                box.appendChild(b);
            });
            div.appendChild(box);
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    async function ask(text) {
        addMsg(text, 'user');
        sendBtn.disabled = true;
        try {
            const res = await fetch('chat.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ q: text })
            });
            const data = await res.json();
            if (data.error) {
                addMsg(data.error, 'bot');
            } else if (data.found) {
                addMsg(data.answer, 'bot', data.source, data.related);
            } else {
                addMsg(data.answer, 'bot');
            }
        } catch (err) {
            addMsg('Gagal menghubungi server. Coba lagi sebentar lagi.', 'bot');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        ask(text);
    });

    fetch('faq_list.php')
        .then(function (r) { return r.json(); })
        .then(function (rows) {
            const picks = rows.slice(0, 6).map(function (r) { return r.pertanyaan; });
            addMsg('Halo! Saya bisa menjawab pertanyaan seputar kepesertaan, iuran, KPA-e, THT, JKK, JKm, pensiun, dan klaim ASABRI. Pilih salah satu atau ketik pertanyaan sendiri.', 'bot', null, picks);
        })
        .catch(function () {
            addMsg('Halo! Ketik pertanyaan seputar program ASABRI.', 'bot');
        });
    </script>
</body>
</html>
